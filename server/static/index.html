<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sensor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div>
    <canvas id="sensorChart"></canvas>
</div>

<script>
const ctx = document.getElementById('sensorChart');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'Temperature, *C',
                data: [],
                borderWidth: 1,
                tension: 0.2,
                yAxisID: 'yTemperature'
            },
            {
                label: 'Humidity, %',
                data: [],
                borderWidth: 1,
                tension: 0.2,
                yAxisID: 'yHumidity'
            },
            {
                label: 'Pressure, hPa',
                data: [],
                borderWidth: 1,
                tension: 0.2,
                yAxisID: 'yPressure'
            }
        ]
    },
    options: {
       responsive: true,
       animation: false,
       interaction: {
            mode: 'index',
            intersect: false
       },
       scales: {
           x: {
               ticks: {
                   maxTicksLimit: 20
               }
           },
           yTemperature: {
               type: 'linear',
               position: 'left',
               title: {
                   display: true,
                   text: 'Temperature, *C'
               }
           },
           yHumidity: {
               type: 'linear',
               position: 'left',
               title: {
                   display: true,
                   text: 'Humidity, %'
               },
               grid: {
                   drawOnChartArea: false
               }
           },
           yPressure: {
               type: 'linear',
               position: 'left',
               title: {
                   display: true,
                   text: 'Pressure, hPa'
               },
               grid: {
                   drawOnChartArea: false
               },
               offset: true
           }
       }
    }
});

async function loadData() {
    const response = await fetch('http://localhost:8000/data');
    const data = await response.json();

    chart.data.labels = data.map(x =>
        new Date(x.created_at).toLocaleTimeString()
    );
    chart.data.datasets[0].data = data.map(x => x.temperature);
    chart.data.datasets[1].data = data.map(x => x.humidity);
    chart.data.datasets[2].data = data.map(x => x.pressure);
    chart.update();
}

loadData();

setInterval(loadData, 1000);
</script>

</body>
</html>
